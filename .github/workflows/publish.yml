name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.113.1). Required when dispatched."
        type: string
        default: ""
      dry-run:
        description: "Dry-run only (skip actual publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` lets the gh-release step create the GitHub
      # Release. `id-token: write` is the npm Trusted Publishing credential:
      # npm exchanges this workflow's OIDC token for a one-time publish
      # token, so there is no long-lived NPM_TOKEN, and provenance is
      # attached automatically.
      contents: write
      id-token: write

    steps:
      # Resolve the release tag from either an explicit workflow_dispatch input
      # or a human-created tag push. CI and the release-tag helper never
      # dispatch this workflow automatically.
      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "No tag provided and not a tag-push event" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "Publishing version $PACKAGE_VERSION from $RELEASE_TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Verify generated CLI reference
        run: pnpm gen:reference:check

      - name: Package smoke
        run: pnpm package:check

      - name: Test
        run: pnpm test
        env:
          CI: true

      # Claude Desktop Extension bundle — attached to the GitHub Release
      # below so users can install via Settings → Extensions without
      # touching claude_desktop_config.json. The version-less `vibeframe.mcpb`
      # copy gives the website a stable always-latest download URL:
      # releases/latest/download/vibeframe.mcpb
      - name: Build MCPB extension bundle
        run: |
          pnpm -F @vibeframe/mcp-server build:mcpb
          cp packages/mcp-server/dist-mcpb/vibeframe-*.mcpb packages/mcp-server/dist-mcpb/vibeframe.mcpb

      # pnpm packs (it rewrites `workspace:*` to real versions), npm
      # publishes: pnpm 9 cannot do the Trusted Publishing OIDC exchange.
      - name: Pack packages
        run: |
          mkdir -p /tmp/packs
          (cd packages/mcp-server && pnpm pack --pack-destination /tmp/packs)
          (cd packages/cli && pnpm pack --pack-destination /tmp/packs)
          ls -l /tmp/packs

      # Dry-run both packages first to catch errors before any real publish
      - name: Validate publish (dry-run)
        run: |
          npm publish /tmp/packs/vibeframe-mcp-server-*.tgz --access public --dry-run
          npm publish /tmp/packs/vibeframe-cli-*.tgz --access public --dry-run

      # Publish both - if one fails, the other may have succeeded.
      # Re-running the workflow is safe: npm ignores already-published versions.
      - name: Publish @vibeframe/mcp-server
        if: ${{ !inputs.dry-run }}
        run: npm publish /tmp/packs/vibeframe-mcp-server-*.tgz --access public

      - name: Publish @vibeframe/cli
        if: ${{ !inputs.dry-run }}
        run: npm publish /tmp/packs/vibeframe-cli-*.tgz --access public

      # ── GitHub Release ─────────────────────────────────────────────────
      # Auto-creates a GitHub Release for every pushed tag, with the
      # CHANGELOG.md section for that version as the body. Skipped on
      # workflow_dispatch dry-runs so manual test runs don't spam Releases.
      - name: Extract release notes from CHANGELOG
        if: ${{ !inputs.dry-run }}
        id: notes
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Extract the section between `## [VERSION]` and the next `## [`
          # heading. Use index() for a literal substring match — `~` would
          # treat `[` / `]` as a character class and match unrelated lines.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "Extracted $(wc -l < /tmp/release-notes.md) lines for v$VERSION"
          # Print to logs for diagnosability — body shows up in Release UI.
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: packages/mcp-server/dist-mcpb/*.mcpb
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
